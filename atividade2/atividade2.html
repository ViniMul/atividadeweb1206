<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Boletim Escolar</title>
</head>
<body>

  <div id="formulario">
    <h1>Boletim Escolar</h1>

    Nome: <input type="text" id="nome"><br><br>
    Curso: <input type="text" id="curso"><br><br>
    Ano: <input type="number" id="ano"><br><br>
    Nota 1: <input type="number" id="n1"><br><br>
    Nota 2: <input type="number" id="n2"><br><br>
    Nota 3: <input type="number" id="n3"><br><br>
    Nota 4: <input type="number" id="n4"><br><br>

    <button onclick="enviar()">Enviar</button>
    <button onclick="limpar()">Limpar</button>
  </div>

  <div id="boletim" style="display:none">
    <h1>Boletim Escolar</h1>
    <table border="1">
      <tr><th colspan="2">Dados do Aluno</th></tr>
      <tr><td>Nome</td><td id="r-nome"></td></tr>
      <tr><td>Curso</td><td id="r-curso"></td></tr>
      <tr><td>Ano</td><td id="r-ano"></td></tr>
      <tr><th colspan="2">Notas</th></tr>
      <tr><td>Nota 1</td><td id="r-n1"></td></tr>
      <tr><td>Nota 2</td><td id="r-n2"></td></tr>
      <tr><td>Nota 3</td><td id="r-n3"></td></tr>
      <tr><td>Nota 4</td><td id="r-n4"></td></tr>
      <tr><td><b>Média</b></td><td id="r-media"></td></tr>
    </table>
    <br>
    <a href="#" onclick="voltar()">Voltar</a>
  </div>

  <script>
    function calculoMedia(n1, n2, n3, n4) {
      return (n1 + n2 + n3 + n4) / 4;
    }

    function enviar() {
      document.getElementById('r-nome').innerText  = document.getElementById('nome').value;
      document.getElementById('r-curso').innerText = document.getElementById('curso').value;
      document.getElementById('r-ano').innerText   = document.getElementById('ano').value;

      var n1 = parseFloat(document.getElementById('n1').value);
      var n2 = parseFloat(document.getElementById('n2').value);
      var n3 = parseFloat(document.getElementById('n3').value);
      var n4 = parseFloat(document.getElementById('n4').value);

      document.getElementById('r-n1').innerText    = n1;
      document.getElementById('r-n2').innerText    = n2;
      document.getElementById('r-n3').innerText    = n3;
      document.getElementById('r-n4').innerText    = n4;
      document.getElementById('r-media').innerText = calculoMedia(n1, n2, n3, n4);

      document.getElementById('formulario').style.display = 'none';
      document.getElementById('boletim').style.display    = 'block';
    }

    function limpar() {
      document.getElementById('nome').value  = '';
      document.getElementById('curso').value = '';
      document.getElementById('ano').value   = '';
      document.getElementById('n1').value    = '';
      document.getElementById('n2').value    = '';
      document.getElementById('n3').value    = '';
      document.getElementById('n4').value    = '';
    }

    function voltar() {
      document.getElementById('boletim').style.display    = 'none';
      document.getElementById('formulario').style.display = 'block';
    }
  </script>

</body>
</html>
